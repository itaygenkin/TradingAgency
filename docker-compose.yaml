services:
  db:
    image: postgres:15-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  worker:
    build: .
    command: celery -A src.trading_agency.celery_app:celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    volumes:
      - ./data/reports:/app/data/reports
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A src.trading_agency.celery_app:celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - db
      - redis

  flower:
    build: .
    command: celery -A src.trading_agency.celery_app:celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    depends_on:
      - worker
      - redis

volumes:
    postgres_data:
    redis_data:
